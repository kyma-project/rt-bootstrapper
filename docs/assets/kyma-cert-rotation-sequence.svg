<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="390"
     font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10">

  <defs>
    <marker id="solid" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0,1 9,5 0,9" fill="#333"/>
    </marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <polyline points="0,1 9,5 0,9" fill="none" stroke="#555" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="860" height="390" fill="white"/>

  <!-- ── Participant boxes ── -->

  <rect x="10"  y="15" width="140" height="40" rx="4" fill="#dce8f5" stroke="#2c5f9e" stroke-width="1.5"/>
  <text x="80"  y="40" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a6e">cert-manager</text>

  <rect x="185" y="15" width="140" height="40" rx="4" fill="#e8f5e9" stroke="#2d7a44" stroke-width="1.5"/>
  <text x="255" y="40" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5e2e">Filesystem</text>

  <rect x="360" y="15" width="140" height="40" rx="4" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="430" y="40" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a148c">certwatcher</text>

  <rect x="535" y="15" width="140" height="40" rx="4" fill="#fdebd0" stroke="#cc7700" stroke-width="1.5"/>
  <text x="605" y="40" text-anchor="middle" font-size="11" font-weight="bold" fill="#7d4000">RT Bootstrapper</text>

  <rect x="710" y="15" width="140" height="40" rx="4" fill="#dce8f5" stroke="#2c5f9e" stroke-width="1.5"/>
  <text x="780" y="40" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a6e">API Server</text>

  <!-- ── Lifelines ── -->
  <line x1="80"  y1="55" x2="80"  y2="360" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="255" y1="55" x2="255" y2="360" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="430" y1="55" x2="430" y2="360" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="605" y1="55" x2="605" y2="360" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="780" y1="55" x2="780" y2="360" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ── 1–3: cert-manager writes cert files to Filesystem ── -->
  <line x1="80" y1="82" x2="255" y2="82"
        stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="167" y="77" text-anchor="middle" font-size="9.5" fill="#222">write tls.crt</text>

  <line x1="80" y1="100" x2="255" y2="100"
        stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="167" y="95" text-anchor="middle" font-size="9.5" fill="#222">write tls.key</text>

  <line x1="80" y1="118" x2="255" y2="118"
        stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="167" y="113" text-anchor="middle" font-size="9.5" fill="#222">write ca.crt</text>

  <!-- ── 4: Filesystem → certwatcher: fsnotify (event notification) ── -->
  <line x1="255" y1="148" x2="430" y2="148"
        stroke="#7b1fa2" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#open)"/>
  <text x="342" y="143" text-anchor="middle" font-size="9.5" fill="#7b1fa2">fsnotify</text>

  <!-- ── 5: certwatcher → RT Bootstrapper: reload cert ── -->
  <line x1="430" y1="176" x2="605" y2="176"
        stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="517" y="171" text-anchor="middle" font-size="9.5" fill="#222">reload cert</text>
  <text x="517" y="188" text-anchor="middle" font-size="9" fill="#888">(tls.Certificate)</text>

  <!-- ── 6: RT Bootstrapper → API Server: Callback() ── -->
  <line x1="605" y1="212" x2="780" y2="212"
        stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="692" y="207" text-anchor="middle" font-size="9.5" fill="#222">Callback()</text>
  <text x="692" y="224" text-anchor="middle" font-size="9" fill="#888">read ca.crt</text>

  <!-- ── 7: RT Bootstrapper → API Server: GET MutatingWebhookConfig ── -->
  <line x1="605" y1="250" x2="780" y2="250"
        stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="692" y="245" text-anchor="middle" font-size="9.5" fill="#222">GET MutatingWebhookConfig</text>

  <!-- ── 8: API Server → RT Bootstrapper: current cfg (return) ── -->
  <line x1="780" y1="276" x2="605" y2="276"
        stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#open)"/>
  <text x="692" y="271" text-anchor="middle" font-size="9.5" fill="#555">current cfg</text>

  <!-- ── 9: RT Bootstrapper → API Server: PATCH caBundle ── -->
  <line x1="605" y1="302" x2="780" y2="302"
        stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="692" y="297" text-anchor="middle" font-size="9.5" fill="#222">PATCH caBundle</text>

  <!-- ── 10: API Server → RT Bootstrapper: OK (return) ── -->
  <line x1="780" y1="328" x2="605" y2="328"
        stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#open)"/>
  <text x="692" y="323" text-anchor="middle" font-size="9.5" fill="#555">OK</text>

  <!-- ── Bottom lifeline caps ── -->
  <rect x="65"  y="360" width="30" height="12" rx="2" fill="#dce8f5" stroke="#2c5f9e" stroke-width="1.5"/>
  <rect x="240" y="360" width="30" height="12" rx="2" fill="#e8f5e9" stroke="#2d7a44" stroke-width="1.5"/>
  <rect x="415" y="360" width="30" height="12" rx="2" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <rect x="590" y="360" width="30" height="12" rx="2" fill="#fdebd0" stroke="#cc7700" stroke-width="1.5"/>
  <rect x="765" y="360" width="30" height="12" rx="2" fill="#dce8f5" stroke="#2c5f9e" stroke-width="1.5"/>

</svg>
