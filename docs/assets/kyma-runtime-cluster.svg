<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="465"
     font-family="'Courier New', Courier, monospace" font-size="10">

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="820" height="465" fill="white"/>

  <!-- Kyma Runtime Cluster -->
  <rect x="10" y="10" width="800" height="443" rx="8"
        fill="#f5f8ff" stroke="#2c5f9e" stroke-width="2.5"/>
  <text x="410" y="32" text-anchor="middle"
        font-size="14" font-weight="bold" fill="#1a3a6e">Kyma Runtime Cluster</text>

  <!-- kyma-system namespace (dashed border = namespace convention) -->
  <rect x="28" y="42" width="764" height="278" rx="6"
        fill="#f0faf0" stroke="#2d7a44" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="44" y="58" font-size="11" font-weight="bold" fill="#1a5e2e">kyma-system</text>

  <!-- Deployment label -->
  <text x="44" y="76" font-size="10.5" fill="#333">
    <tspan font-weight="bold">Deployment:</tspan>  rt-bootstrapper-controller-manager
  </text>

  <!-- Pod / Container box -->
  <rect x="44" y="82" width="728" height="126" rx="4"
        fill="#fffbf0" stroke="#cc7700" stroke-width="1.5"/>
  <text x="58" y="99" font-size="10.5" fill="#5a3e00">
    <tspan font-weight="bold">Pod:</tspan>  rt-bootstrapper-controller-manager-xxx
  </text>
  <text x="58" y="115" font-size="10.5" fill="#5a3e00">
    <tspan font-weight="bold">Container:</tspan>  manager
  </text>
  <text x="76" y="131" fill="#5a3e00">• Port 9443   (webhook, TLS 1.3)</text>
  <text x="76" y="146" fill="#5a3e00">• Port 8080   (metrics, HTTP)</text>
  <text x="76" y="161" fill="#5a3e00">• Port 8081   (health / readiness probes)</text>
  <text x="76" y="176" fill="#5a3e00">• PriorityClass: 2 100 000</text>

  <!-- Resources — column 1 -->
  <text x="44" y="222"><tspan font-weight="bold" fill="#1a5276">Service:</tspan><tspan fill="#333">                  rt-bootstrapper-webhook-service (port 443)</tspan></text>
  <text x="44" y="238"><tspan font-weight="bold" fill="#7b241c">Secret:</tspan><tspan fill="#333">                   registry-credentials (master pull secret)</tspan></text>
  <text x="44" y="254"><tspan font-weight="bold" fill="#4a235a">ConfigMap:</tspan><tspan fill="#333">                 rt-bootstrapper-config</tspan></text>
  <text x="44" y="270"><tspan font-weight="bold" fill="#0e6655">CTrustBundle:</tspan><tspan fill="#333">              (cluster-scoped)</tspan></text>
  <text x="44" y="286"><tspan font-weight="bold" fill="#7e5109">Certificate:</tspan><tspan fill="#333">               serving-cert (cert-manager CR)</tspan></text>
  <text x="44" y="302"><tspan font-weight="bold" fill="#154360">MutatingWebhookConfiguration:</tspan><tspan fill="#333"> (cluster-scoped)</tspan></text>

  <!-- Resources — column 2 -->
  <text x="430" y="222"><tspan font-weight="bold" fill="#2e4053">PriorityClass:</tspan><tspan fill="#333">   rt-bootstrapper-priority-class</tspan></text>
  <text x="430" y="238"><tspan font-weight="bold" fill="#1a5276">Service:</tspan><tspan fill="#333">         controller-manager-metrics-service (port 8080)</tspan></text>
  <text x="430" y="254"><tspan font-weight="bold" fill="#145a32">ServiceMonitor:</tspan><tspan fill="#333"> controller-manager-metrics-monitor</tspan></text>
  <text x="430" y="270"><tspan font-weight="bold" fill="#6e2f1a">NetworkPolicy:</tspan><tspan fill="#333">  allow-egress-to-apiserver</tspan></text>
  <text x="430" y="286"><tspan font-weight="bold" fill="#6e2f1a">NetworkPolicy:</tspan><tspan fill="#333">  allow-ingress-webhook-traffic</tspan></text>
  <text x="430" y="302"><tspan font-weight="bold" fill="#6e2f1a">NetworkPolicy:</tspan><tspan fill="#333">  allow-ingress-metrics-traffic</tspan></text>

  <!-- Secret sync — source (kyma-system) -->
  <rect x="28" y="334" width="345" height="90" rx="6"
        fill="#fffbf0" stroke="#b7950b" stroke-width="1.5"/>
  <text x="44" y="351" font-size="10.5" font-weight="bold" fill="#7d6608">namespace: kyma-system</text>
  <text x="44" y="369" font-size="10.5">
    <tspan font-weight="bold" fill="#7b241c">Secret:</tspan><tspan fill="#333">  registry-creds</tspan>
  </text>
  <text x="44" y="385" fill="#888">(master)</text>

  <!-- Sync arrow -->
  <line x1="373" y1="379" x2="445" y2="379"
        stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Secret sync — target (other namespace) -->
  <rect x="449" y="334" width="345" height="90" rx="6"
        fill="#f6f8fa" stroke="#b7950b" stroke-width="1.5"/>
  <text x="465" y="351" font-size="10.5" font-weight="bold" fill="#7d6608">namespace: &lt;other&gt;</text>
  <text x="465" y="369" font-size="10.5">
    <tspan font-weight="bold" fill="#7b241c">Secret:</tspan><tspan fill="#333">  registry-creds</tspan>
  </text>
  <text x="465" y="385" fill="#888">(synced copy)</text>

</svg>
