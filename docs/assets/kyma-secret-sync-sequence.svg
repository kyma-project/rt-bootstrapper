<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="380"
     font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10">

  <defs>
    <marker id="solid" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0,1 9,5 0,9" fill="#333"/>
    </marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <polyline points="0,1 9,5 0,9" fill="none" stroke="#555" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="740" height="380" fill="white"/>

  <!-- ── Participant boxes ── -->

  <rect x="15" y="15" width="120" height="40" rx="4"
        fill="#e8f4f8" stroke="#1a6e8a" stroke-width="1.5"/>
  <text x="75" y="40" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d4a5e">KIM</text>

  <rect x="165" y="15" width="150" height="40" rx="4"
        fill="#dce8f5" stroke="#2c5f9e" stroke-width="1.5"/>
  <text x="240" y="40" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a6e">API Server</text>

  <rect x="360" y="15" width="160" height="40" rx="4"
        fill="#fdebd0" stroke="#cc7700" stroke-width="1.5"/>
  <text x="440" y="40" text-anchor="middle" font-size="11" font-weight="bold" fill="#7d4000">Secret Controller</text>

  <rect x="563" y="15" width="162" height="40" rx="4"
        fill="#dce8f5" stroke="#2c5f9e" stroke-width="1.5"/>
  <text x="644" y="33" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a6e">API Server</text>
  <text x="644" y="48" text-anchor="middle" font-size="8.5" fill="#6688bb">(same instance)</text>

  <!-- ── Lifelines ── -->
  <line x1="75"  y1="55" x2="75"  y2="355" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="240" y1="55" x2="240" y2="355" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="440" y1="55" x2="440" y2="355" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="644" y1="55" x2="644" y2="355" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ── 1: KIM → API Server: PUT Secret ── -->
  <line x1="75" y1="82" x2="240" y2="82"
        stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="157" y="77" text-anchor="middle" font-size="9.5" fill="#222">PUT Secret</text>
  <text x="157" y="94" text-anchor="middle" font-size="9" fill="#888">(kyma-system/registry-creds)</text>

  <!-- ── 2: API Server → Secret Controller: watch event ── -->
  <line x1="240" y1="122" x2="440" y2="122"
        stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="340" y="117" text-anchor="middle" font-size="9.5" fill="#222">watch event</text>
  <text x="340" y="134" text-anchor="middle" font-size="9" fill="#888">(masterSecret: .dockerconfig changed)</text>

  <!-- ── 3: Secret Controller → API Server: LIST Namespaces ── -->
  <line x1="440" y1="168" x2="644" y2="168"
        stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="542" y="163" text-anchor="middle" font-size="9.5" fill="#222">LIST Namespaces</text>

  <!-- ── 4: API Server → Secret Controller: all namespaces (return) ── -->
  <line x1="644" y1="192" x2="440" y2="192"
        stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#open)"/>
  <text x="542" y="187" text-anchor="middle" font-size="9.5" fill="#555">all namespaces</text>

  <!-- ── Loop combined fragment ── -->
  <rect x="420" y="208" width="252" height="94" rx="2"
        fill="#f8f9ff" stroke="#5c6bc0" stroke-width="1.2"/>
  <!-- Pentagon operator tab -->
  <polygon points="420,208 420,222 446,222 452,215 446,208"
           fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1.2"/>
  <text x="436" y="219" text-anchor="middle" font-size="8" font-weight="bold" fill="#1a237e">loop</text>
  <!-- Guard condition -->
  <text x="462" y="234" font-size="9" fill="#444">[for each namespace]</text>
  <!-- Header separator -->
  <line x1="420" y1="240" x2="672" y2="240" stroke="#5c6bc0" stroke-width="0.7"/>

  <!-- ── 5: Secret Controller → API Server: PATCH Secret ── -->
  <line x1="440" y1="258" x2="644" y2="258"
        stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="542" y="253" text-anchor="middle" font-size="9.5" fill="#222">PATCH Secret</text>
  <text x="542" y="270" text-anchor="middle" font-size="9" fill="#888">(server-side apply)</text>

  <!-- ── 6: API Server → Secret Controller: OK (return) ── -->
  <line x1="644" y1="290" x2="440" y2="290"
        stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#open)"/>
  <text x="542" y="285" text-anchor="middle" font-size="9.5" fill="#555">OK</text>

  <!-- ── 7: requeue after 1m — timer/boundary notation ── -->
  <line x1="440" y1="322" x2="532" y2="322"
        stroke="#333" stroke-width="1.5"/>
  <line x1="532" y1="315" x2="532" y2="329"
        stroke="#333" stroke-width="2.5"/>
  <text x="484" y="317" text-anchor="middle" font-size="9.5" fill="#222">requeue after 1m</text>

  <!-- ── Bottom lifeline caps ── -->
  <rect x="60"  y="355" width="30" height="12" rx="2" fill="#e8f4f8" stroke="#1a6e8a"  stroke-width="1.5"/>
  <rect x="225" y="355" width="30" height="12" rx="2" fill="#dce8f5" stroke="#2c5f9e"  stroke-width="1.5"/>
  <rect x="425" y="355" width="30" height="12" rx="2" fill="#fdebd0" stroke="#cc7700"  stroke-width="1.5"/>
  <rect x="629" y="355" width="30" height="12" rx="2" fill="#dce8f5" stroke="#2c5f9e"  stroke-width="1.5"/>

</svg>
