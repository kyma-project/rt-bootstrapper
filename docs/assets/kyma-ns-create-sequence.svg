<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="325"
     font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10">

  <defs>
    <marker id="solid" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0,1 9,5 0,9" fill="#333"/>
    </marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <polyline points="0,1 9,5 0,9" fill="none" stroke="#555" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="740" height="325" fill="white"/>

  <!-- ── Participant boxes ── -->

  <rect x="15" y="15" width="130" height="40" rx="4"
        fill="#f3f3f3" stroke="#888" stroke-width="1.5"/>
  <text x="80" y="40" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">Any actor</text>

  <rect x="165" y="15" width="150" height="40" rx="4"
        fill="#dce8f5" stroke="#2c5f9e" stroke-width="1.5"/>
  <text x="240" y="40" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a6e">API Server</text>

  <rect x="360" y="15" width="160" height="40" rx="4"
        fill="#fdebd0" stroke="#cc7700" stroke-width="1.5"/>
  <text x="440" y="40" text-anchor="middle" font-size="11" font-weight="bold" fill="#7d4000">Secret Controller</text>

  <rect x="563" y="15" width="162" height="40" rx="4"
        fill="#dce8f5" stroke="#2c5f9e" stroke-width="1.5"/>
  <text x="644" y="33" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a6e">API Server</text>
  <text x="644" y="48" text-anchor="middle" font-size="8.5" fill="#6688bb">(same instance)</text>

  <!-- ── Lifelines ── -->
  <line x1="80"  y1="55" x2="80"  y2="298" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="240" y1="55" x2="240" y2="298" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="440" y1="55" x2="440" y2="298" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="644" y1="55" x2="644" y2="298" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ── 1: Any actor → API Server: create NS ── -->
  <line x1="80" y1="82" x2="240" y2="82"
        stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="160" y="77" text-anchor="middle" font-size="9.5" fill="#222">create NS</text>

  <!-- ── 2: API Server → Secret Controller: watch event ── -->
  <line x1="240" y1="112" x2="440" y2="112"
        stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="340" y="107" text-anchor="middle" font-size="9.5" fill="#222">watch event</text>
  <text x="340" y="124" text-anchor="middle" font-size="9" fill="#888">(createNsPredicate:</text>
  <text x="340" y="136" text-anchor="middle" font-size="9" fill="#888">create only, not master NS)</text>

  <!-- ── 3: Secret Controller → API Server: GET master secret ── -->
  <line x1="440" y1="166" x2="644" y2="166"
        stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="542" y="161" text-anchor="middle" font-size="9.5" fill="#222">GET master secret</text>

  <!-- ── 4: API Server → Secret Controller: registry-creds (return) ── -->
  <line x1="644" y1="190" x2="440" y2="190"
        stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#open)"/>
  <text x="542" y="185" text-anchor="middle" font-size="9.5" fill="#555">registry-creds</text>

  <!-- ── 5: Secret Controller → API Server: PATCH Secret ── -->
  <line x1="440" y1="218" x2="644" y2="218"
        stroke="#333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="542" y="213" text-anchor="middle" font-size="9.5" fill="#222">PATCH Secret</text>
  <text x="542" y="230" text-anchor="middle" font-size="9" fill="#888">(new NS, server-side apply)</text>

  <!-- ── 6: API Server → Secret Controller: OK (return) ── -->
  <line x1="644" y1="258" x2="440" y2="258"
        stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#open)"/>
  <text x="542" y="253" text-anchor="middle" font-size="9.5" fill="#555">OK</text>

  <!-- ── Bottom lifeline caps ── -->
  <rect x="65"  y="298" width="30" height="12" rx="2" fill="#f3f3f3"  stroke="#888"    stroke-width="1.5"/>
  <rect x="225" y="298" width="30" height="12" rx="2" fill="#dce8f5"  stroke="#2c5f9e" stroke-width="1.5"/>
  <rect x="425" y="298" width="30" height="12" rx="2" fill="#fdebd0"  stroke="#cc7700" stroke-width="1.5"/>
  <rect x="629" y="298" width="30" height="12" rx="2" fill="#dce8f5"  stroke="#2c5f9e" stroke-width="1.5"/>

</svg>
