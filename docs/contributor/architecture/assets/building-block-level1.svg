<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="1060" height="570"
     viewBox="0 0 1060 570"
     style="background:#ffffff; font-family:Helvetica,Arial,sans-serif;">

  <defs>
    <marker id="arr-dark"   markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#444444"/>
    </marker>
    <marker id="arr-green"  markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#2e7d32"/>
    </marker>
    <marker id="arr-blue"   markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#1565c0"/>
    </marker>
    <marker id="arr-orange" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#e65100"/>
    </marker>
  </defs>

  <!-- RT Bootstrapper boundary  x=230..760  y=45..490 -->
  <rect x="230" y="45" width="530" height="445" rx="16" ry="16"
        fill="#f9fdf9" stroke="#43a047" stroke-width="2" stroke-dasharray="10,4"/>
  <text x="495" y="68" text-anchor="middle"
        font-size="15" font-weight="bold" fill="#1b5e20">RT Bootstrapper</text>

  <!-- API Server  x=20..190  y=185..310 -->
  <rect x="20" y="185" width="170" height="125" rx="8" ry="8"
        fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
  <text x="105" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">API Server</text>
  <text x="105" y="238" text-anchor="middle" font-size="10" fill="#555">(Kubernetes)</text>
  <text x="105" y="256" text-anchor="middle" font-size="10" fill="#555">watch · admission</text>
  <text x="105" y="274" text-anchor="middle" font-size="10" fill="#555">webhook</text>

  <!-- Mutating Webhook  x=250..465  y=70..240 -->
  <rect x="250" y="70" width="215" height="170" rx="10" ry="10"
        fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="357" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">Mutating Webhook</text>
  <text x="357" y="120" text-anchor="middle" font-size="10" fill="#2e7d32">internal/webhook/</text>
  <text x="357" y="138" text-anchor="middle" font-size="10" fill="#2e7d32">Intercepts Pod admission;</text>
  <text x="357" y="155" text-anchor="middle" font-size="10" fill="#2e7d32">applies feature-based defaulters</text>
  <text x="357" y="172" text-anchor="middle" font-size="10" fill="#388e3c">Port 9443 · TLS 1.3</text>
  <text x="357" y="189" text-anchor="middle" font-size="10" fill="#388e3c">hot-reload TLS · caBundle patch</text>
  <text x="357" y="206" text-anchor="middle" font-size="10" fill="#388e3c">cert auto-rotation</text>
  <text x="357" y="223" text-anchor="middle" font-size="10" fill="#388e3c">MutatingWebhookConfig update</text>

  <!-- Secret Controller  x=250..465  y=340..465 -->
  <rect x="250" y="340" width="215" height="125" rx="10" ry="10"
        fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="357" y="371" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">Secret Controller</text>
  <text x="357" y="390" text-anchor="middle" font-size="10" fill="#1565c0">internal/controller/</text>
  <text x="357" y="408" text-anchor="middle" font-size="10" fill="#1565c0">Watches master pull secret;</text>
  <text x="357" y="426" text-anchor="middle" font-size="10" fill="#1565c0">syncs copies to all namespaces</text>
  <text x="357" y="444" text-anchor="middle" font-size="10" fill="#1565c0">via server-side apply</text>

  <!-- Configuration API  x=540..745  y=185..375 -->
  <rect x="540" y="185" width="205" height="190" rx="10" ry="10"
        fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="642" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">Configuration API</text>
  <text x="642" y="235" text-anchor="middle" font-size="10" fill="#bf360c">pkg/api/v1/</text>
  <text x="642" y="253" text-anchor="middle" font-size="10" fill="#bf360c">Config struct · feature constants</text>
  <text x="642" y="271" text-anchor="middle" font-size="10" fill="#bf360c">JSON decode · validation</text>
  <text x="642" y="289" text-anchor="middle" font-size="10" fill="#bf360c">re-read from cluster on each</text>
  <text x="642" y="307" text-anchor="middle" font-size="10" fill="#bf360c">webhook invocation</text>
  <text x="642" y="325" text-anchor="middle" font-size="10" fill="#bf360c">(via GetConfig callback)</text>

  <!-- All Namespaces  x=830..1010  y=70..165 -->
  <rect x="830" y="70" width="180" height="95" rx="8" ry="8"
        fill="#e8f4fb" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="920" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">All Namespaces</text>
  <text x="920" y="121" text-anchor="middle" font-size="10" fill="#444">registry-credentials</text>
  <text x="920" y="138" text-anchor="middle" font-size="10" fill="#444">(synced copy)</text>

  <!-- rt-bootstrapper-config  x=830..1010  y=370..465 -->
  <rect x="830" y="370" width="180" height="95" rx="8" ry="8"
        fill="#e8f4fb" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="920" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">rt-bootstrapper-config</text>
  <text x="920" y="422" text-anchor="middle" font-size="10" fill="#444">ConfigMap (kyma-system)</text>
  <text x="920" y="440" text-anchor="middle" font-size="10" fill="#444">JSON-encoded Config</text>

  <!--
  ARROW ROUTE PROOF
  Boxes:             left   right  top    bot
    API Server       20     190    185    310
    Webhook          250    465    70     240
    Secret Ctrl      250    465    340    465
    Config API       540    745    185    375
    All NS           830    1010   70     165
    ConfigMap        830    1010   370    465
    RT boundary      230    760    45     490

  Corridors (all clear of every box listed above):
    y=38   top: above Webhook(70), All NS(70), Config API(185), API Server(185) ✓
    x=210  left-A: right of API Server(190), left of Webhook(250) ✓
    x=225  left-B: same range ✓
    y=278  mid: below Webhook(240), above Secret Ctrl(340) — 100px gap ✓
    x=490  centre: right of Webhook(465), left of Config API(540) — 50px gap ✓
    x=790  right-A: right of Config API(745), left of All NS / ConfigMap(830) — 40px gap ✓
    x=808  right-B: same range ✓
    y=500  bottom: below Secret Ctrl(465), ConfigMap(465), Config API(375) ✓

  ARROWS:
  1. API Server(190,205) → Webhook(250,140)
     (190,205) H→(210,205) V↑(140) H→(249,140)
     Label y=38 (top corridor): "POST /mutate-v1-pod  (Pod admission request)"
     Check: x=210 in left-A ✓, y=140 clears API Server top(185) ✓

  2. Webhook(250,185) → API Server(190,255)
     (250,185) H←(225,185) V↓(255) H←(191,255)
     Label x=10, y=163..176 (LEFT of x=225, above API Server top y=185 — y=163 < 185 ✓)
     Check: x=225 in left-B ✓

  3. API Server(190,280) → Secret Ctrl(250,370)
     (190,280) H→(210,280) V↓(370) H→(249,370)
     Label x=10, y=291..304 (left of x=210, in mid corridor y=278 area — y=291>278 and y=304<340 ✓)
     Check: x=210 in left-A, y=291..304 in gap(240..340) ✓

  4. Webhook(465,155) → Config API(540,280)
     (465,155) H→(490,155) V↓(280) H→(539,280)
     Label x=492, y=248..261 (beside vertical x=490, between Webhook bottom 240 and Config API top 185)
     y=248: Webhook bottom=240 → y=248 > 240, Config API top=185 → y=248 > 185 so inside Config API vertically.
     BUT x=492 > 465 (right of Webhook) AND x=492 < 540 (left of Config API) → NOT inside either box ✓
     y=248..261: in centre gap corridor ✓

  5. Secret Ctrl(465,400) → All NS(830,117)
     (465,400) H→(790,400) V↑(117) H→(829,117)
     Horiz y=400: x=465..790, passes below Config API(bot=375) since y=400 > 375 ✓, passes below Secret Ctrl interior but starts at its right edge ✓
     Vert x=790: y=117..400, right of Config API(right=745) ✓
     Horiz y=117: x=790..829, above All NS(top=70) NO: y=117 is inside All NS (top=70, bot=165). That's fine — it arrives at the left edge of All NS at y=117 ✓
     Label on horiz y=400 segment: x=530, y=414 — x=530>465 (right of Secret Ctrl right=465), y=414<465 (above Secret Ctrl bot) BUT x=530>465 so NOT in Secret Ctrl box ✓
     Label on vert x=790: x=794, y=278 — in mid corridor, right of Config API ✓

  6. Config API(745,290) → ConfigMap(830,415)
     (745,290) H→(808,290) V↓(415) H→(829,415)
     Horiz y=290: x=745..808, right of Config API right=745 ✓, left of ext boxes left=830 ✓
     Vert x=808: y=290..415, right-B corridor ✓ (no overlap with arrow 5 vert at x=790)
     ConfigMap top=370, horiz y=415 inside ConfigMap — arrives at left edge ✓
     Label beside horiz: x=748, y=283 (above line y=290, x=748>745 right of Config API edge) — y=283 is inside Config API vertically (185..375). BUT x=748>745, so NOT inside Config API box ✓
  -->

  <!-- Arrow 1: API Server → Mutating Webhook (admission request) -->
  <path d="M 190 205  H 210  V 140  H 249"
        fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="214" y="35" font-size="10" fill="#333">POST /mutate-v1-pod  (Pod admission request)</text>

  <!-- Arrow 2: Mutating Webhook → API Server (admission response) -->
  <path d="M 250 185  H 225  V 255  H 191"
        fill="none" stroke="#2e7d32" stroke-width="1.5"
        stroke-dasharray="6,3" marker-end="url(#arr-green)"/>
  <text x="10" y="163" font-size="10" fill="#2e7d32">mutated</text>
  <text x="10" y="176" font-size="10" fill="#2e7d32">admission</text>
  <text x="10" y="189" font-size="10" fill="#2e7d32">response</text>

  <!-- Arrow 3: API Server → Secret Controller (watch events) -->
  <path d="M 190 280  H 210  V 370  H 249"
        fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="10" y="289" font-size="10" fill="#333">Secret / Namespace</text>
  <text x="10" y="302" font-size="10" fill="#333">watch events</text>

  <!-- Arrow 4: Mutating Webhook → Configuration API (uses) -->
  <path d="M 465 155  H 490  V 280  H 539"
        fill="none" stroke="#e65100" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <text x="492" y="248" font-size="10" fill="#e65100">uses</text>
  <text x="492" y="261" font-size="10" fill="#e65100">Config API</text>

  <!-- Arrow 5: Secret Controller → All Namespaces (secret sync) -->
  <path d="M 465 400  H 790  V 117  H 829"
        fill="none" stroke="#1565c0" stroke-width="1.5"
        stroke-dasharray="6,3" marker-end="url(#arr-blue)"/>
  <text x="530" y="414" font-size="10" fill="#1565c0">syncs registry-credentials to all namespaces</text>
  <text x="794" y="275" font-size="10" fill="#1565c0">secret</text>
  <text x="794" y="288" font-size="10" fill="#1565c0">sync</text>

  <!-- Arrow 6: Configuration API → rt-bootstrapper-config (reads) -->
  <path d="M 745 290  H 808  V 415  H 829"
        fill="none" stroke="#e65100" stroke-width="1.5"
        stroke-dasharray="6,3" marker-end="url(#arr-orange)"/>
  <text x="748" y="283" font-size="10" fill="#e65100">reads JSON</text>
  <text x="748" y="296" font-size="10" fill="#e65100">on each call</text>

  <!-- Legend  x=20..235  y=490..570 -->
  <rect x="20" y="490" width="220" height="68" rx="6" ry="6"
        fill="#fafafa" stroke="#cccccc" stroke-width="1"/>

  <line x1="30" y1="508" x2="75" y2="508"
        stroke="#444" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="82" y="512" font-size="10" fill="#333">synchronous call</text>

  <line x1="30" y1="526" x2="75" y2="526"
        stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-green)"/>
  <text x="82" y="530" font-size="10" fill="#333">admission response</text>

  <line x1="150" y1="508" x2="195" y2="508"
        stroke="#1565c0" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-blue)"/>
  <text x="202" y="512" font-size="10" fill="#333">secret sync</text>

  <line x1="150" y1="526" x2="195" y2="526"
        stroke="#e65100" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <text x="202" y="530" font-size="10" fill="#333">dependency / reads</text>

  <line x1="30" y1="544" x2="75" y2="544"
        stroke="#e65100" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-orange)"/>
  <text x="82" y="548" font-size="10" fill="#333">async read</text>

</svg>
