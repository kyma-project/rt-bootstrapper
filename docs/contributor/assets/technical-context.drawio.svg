<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="860" height="580"
     viewBox="0 0 860 580"
     style="background:#ffffff; font-family:Helvetica,Arial,sans-serif;">

  <!-- ── Background panels ──────────────────────────────────────────── -->

  <!-- Kyma Runtime Cluster boundary -->
  <rect x="10" y="10" width="840" height="560" rx="18" ry="18"
        fill="#f5f5f5" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="420" y="35" text-anchor="middle" font-size="13" font-weight="bold" fill="#555555">Kyma Runtime Cluster (SKR)</text>

  <!-- kyma-system namespace panel -->
  <rect x="40" y="380" width="480" height="160" rx="10" ry="10"
        fill="#e8f4fb" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="280" y="400" text-anchor="middle" font-size="11" font-weight="bold" fill="#2980b9">namespace: kyma-system</text>

  <!-- ── External actors ────────────────────────────────────────────── -->

  <!-- KIM box (outside cluster, top-left) -->
  <rect x="30" y="50" width="130" height="50" rx="8" ry="8"
        fill="#fffde7" stroke="#f9a825" stroke-width="1.5"/>
  <text x="95" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">KIM</text>
  <text x="95" y="95" text-anchor="middle" font-size="9" fill="#666">(Kyma Infrastructure Manager)</text>

  <!-- ── Internal components ────────────────────────────────────────── -->

  <!-- API Server box -->
  <rect x="300" y="50" width="140" height="50" rx="8" ry="8"
        fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="370" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">API Server</text>

  <!-- RT Bootstrapper box -->
  <rect x="560" y="50" width="170" height="70" rx="8" ry="8"
        fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="645" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">RT Bootstrapper</text>
  <text x="645" y="96" text-anchor="middle" font-size="10" fill="#2e7d32">Webhook + Secret Ctrl</text>
  <text x="645" y="110" text-anchor="middle" font-size="9" fill="#388e3c">:9443 (TLS 1.3)</text>

  <!-- Pod box -->
  <rect x="300" y="270" width="140" height="50" rx="8" ry="8"
        fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="370" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Pod</text>
  <text x="370" y="313" text-anchor="middle" font-size="9" fill="#555">(workload)</text>

  <!-- kyma-system resources -->
  <rect x="60" y="415" width="180" height="105" rx="7" ry="7"
        fill="#ffffff" stroke="#7ec8e3" stroke-width="1"/>
  <text x="150" y="435" text-anchor="middle" font-size="10" font-weight="bold" fill="#2980b9">Shared Resources</text>
  <text x="150" y="453" text-anchor="middle" font-size="10" fill="#333">• registry-credentials</text>
  <text x="150" y="468" text-anchor="middle" font-size="10" fill="#333">  (master pull secret)</text>
  <text x="150" y="483" text-anchor="middle" font-size="10" fill="#333">• rt-bootstrapper-config</text>
  <text x="150" y="498" text-anchor="middle" font-size="10" fill="#333">  (ConfigMap)</text>
  <text x="150" y="513" text-anchor="middle" font-size="10" fill="#333">• ClusterTrustBundle</text>

  <!-- Other namespaces box -->
  <rect x="310" y="415" width="190" height="105" rx="7" ry="7"
        fill="#ffffff" stroke="#7ec8e3" stroke-width="1"/>
  <text x="405" y="435" text-anchor="middle" font-size="10" font-weight="bold" fill="#2980b9">All Other Namespaces</text>
  <text x="405" y="455" text-anchor="middle" font-size="10" fill="#333">• registry-credentials</text>
  <text x="405" y="470" text-anchor="middle" font-size="10" fill="#555">  (synced copy)</text>

  <!-- ── Arrows ──────────────────────────────────────────────────────── -->

  <!-- KIM → API Server: provisions / updates -->
  <line x1="160" y1="75" x2="298" y2="75"
        stroke="#f9a825" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="229" y="68" text-anchor="middle" font-size="9" fill="#e65100">provisions / updates</text>

  <!-- API Server → RT Bootstrapper: POST /mutate (Pod admission) -->
  <line x1="440" y1="75" x2="558" y2="75"
        stroke="#333" stroke-width="1.5" marker-end="url(#arrow-black)"/>
  <text x="499" y="58" text-anchor="middle" font-size="9" fill="#111">POST /mutate--v1-pod</text>
  <text x="499" y="70" text-anchor="middle" font-size="9" fill="#111">(Pod admission)</text>

  <!-- RT Bootstrapper → API Server: admission response -->
  <line x1="558" y1="100" x2="440" y2="100"
        stroke="#43a047" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <text x="499" y="115" text-anchor="middle" font-size="9" fill="#2e7d32">mutated admission response</text>

  <!-- API Server → Pod: creates -->
  <line x1="370" y1="102" x2="370" y2="268"
        stroke="#333" stroke-width="1.5" marker-end="url(#arrow-black)"/>
  <text x="390" y="190" text-anchor="start" font-size="9" fill="#111">creates Pod</text>

  <!-- RT Bootstrapper ↔ kyma-system: reads ConfigMap / patches webhook cfg -->
  <path d="M 645 122 L 645 360 Q 645 375 630 375 L 252 375 Q 237 375 237 390 L 237 413"
        fill="none" stroke="#43a047" stroke-width="1.5" stroke-dasharray="5,3"
        marker-end="url(#arrow-green)"/>
  <text x="455" y="368" text-anchor="middle" font-size="9" fill="#2e7d32">reads ConfigMap; patches MutatingWebhookConfiguration</text>

  <!-- RT Bootstrapper (secret ctrl) → Other NS -->
  <path d="M 645 122 L 645 460 Q 645 480 630 480 L 502 480"
        fill="none" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="5,3"
        marker-end="url(#arrow-blue)"/>
  <text x="680" y="310" text-anchor="start" font-size="9" fill="#1565c0">syncs registry-credentials</text>
  <text x="680" y="322" text-anchor="start" font-size="9" fill="#1565c0">to all namespaces</text>

  <!-- ── Legend ────────────────────────────────────────────────────── -->
  <rect x="560" y="360" width="270" height="100" rx="6" ry="6"
        fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
  <text x="695" y="378" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Legend</text>
  <!-- solid line -->
  <line x1="575" y1="395" x2="625" y2="395" stroke="#333" stroke-width="1.5" marker-end="url(#arrow-black)"/>
  <text x="635" y="399" font-size="9" fill="#333">synchronous call</text>
  <!-- dashed line -->
  <line x1="575" y1="415" x2="625" y2="415" stroke="#43a047" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <text x="635" y="419" font-size="9" fill="#333">async / internal API call</text>
  <!-- orange line -->
  <line x1="575" y1="435" x2="625" y2="435" stroke="#f9a825" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="635" y="439" font-size="9" fill="#333">KIM lifecycle management</text>

  <!-- ── Arrow marker definitions ─────────────────────────────────── -->
  <defs>
    <marker id="arrow-black" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#333333"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#43a047"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f9a825"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1565c0"/>
    </marker>
  </defs>

</svg>
